name: Build Examples

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "all, an example name, or a repo-relative example path"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Classify changes and check first-party Markdown
    runs-on: ubuntu-latest
    outputs:
      idf_route: ${{ steps.route.outputs.idf_route }}
      idf_selectors: ${{ steps.route.outputs.idf_selectors }}
      arduino_route: ${{ steps.route.outputs.arduino_route }}
      arduino_selectors: ${{ steps.route.outputs.arduino_selectors }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      firmware_paths: ${{ steps.route.outputs.firmware_paths }}
      release_paths: ${{ steps.route.outputs.release_paths }}
      unknown_paths: ${{ steps.route.outputs.unknown_paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify complete rename-aware diff
        id: route
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/ci_routing.py --manual-selector "${{ inputs.target }}" --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/ci_routing.py --base "${{ github.event.pull_request.base.sha }}" --github-output "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* || "${{ github.event.before }}" =~ ^0+$ ]]; then
            python3 scripts/ci_routing.py --manual-selector all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_routing.py --base "${{ github.event.before }}" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Run lightweight helper tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Check first-party Markdown (limited scope)
        run: python3 scripts/check_first_party_markdown.py . --config config/markdown-audit.json

  discover-esp-idf:
    name: Discover ESP-IDF examples
    needs: quality
    if: needs.quality.outputs.idf_route != 'none'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: discover
        shell: bash
        env:
          SELECTORS: ${{ needs.quality.outputs.idf_selectors }}
        run: |
          args=()
          if [ "${{ needs.quality.outputs.idf_route }}" = "selected" ]; then
            while IFS= read -r selector; do args+=(--selector "$selector"); done < <(python3 -c 'import json,sys; print(*json.loads(sys.argv[1]), sep="\n")' "$SELECTORS")
          else
            args+=(--selector all)
          fi
          python3 scripts/discover_examples.py --surface esp-idf "${args[@]}" --idf-versions v5.5.5,v6.0.2 --github-output "$GITHUB_OUTPUT"

  build-esp-idf:
    name: ${{ matrix.idf }} / ${{ matrix.name }}
    needs: discover-esp-idf
    if: needs.discover-esp-idf.outputs.count != '0'
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-esp-idf.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build ${{ matrix.path }} with ESP-IDF ${{ matrix.idf }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C "${{ matrix.path }}" -B "build/${{ matrix.name }}-${{ matrix.idf }}" set-target esp32s3 build
      - name: Package firmware
        shell: bash
        run: |
          python3 releases/package_firmware.py \
            --framework esp-idf \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.idf }}" \
            --name "ESP32-S3-Touch-LCD-1.69-${{ matrix.name }}-${{ matrix.idf }}" \
            --framework-version "${{ matrix.idf }}" \
            --target esp32s3 \
            --git-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp-idf-${{ matrix.name }}-${{ matrix.idf }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  discover-arduino:
    name: Discover Arduino sketches
    needs: quality
    if: needs.quality.outputs.arduino_route != 'none'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: discover
        shell: bash
        env:
          SELECTORS: ${{ needs.quality.outputs.arduino_selectors }}
        run: |
          args=()
          if [ "${{ needs.quality.outputs.arduino_route }}" = "selected" ]; then
            while IFS= read -r selector; do args+=(--selector "$selector"); done < <(python3 -c 'import json,sys; print(*json.loads(sys.argv[1]), sep="\n")' "$SELECTORS")
          else
            args+=(--selector all)
          fi
          python3 scripts/discover_examples.py --surface arduino "${args[@]}" --arduino-core 3.3.11 --fqbn esp32:esp32:esp32s3 --github-output "$GITHUB_OUTPUT"

  build-arduino:
    name: ${{ matrix.name }}
    needs: discover-arduino
    if: needs.discover-arduino.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-arduino.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compile ${{ matrix.path }}
        shell: bash
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --libraries examples/arduino/libraries --export-binaries --output-dir "build/${{ matrix.name }}-${{ matrix.core }}" "${{ matrix.path }}"
      - name: Package firmware
        run: |
          python3 releases/package_firmware.py \
            --framework arduino \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            --name "ESP32-S3-Touch-LCD-1.69-${{ matrix.name }}-arduino-${{ matrix.core }}" \
            --framework-version "${{ matrix.core }}" \
            --target esp32s3 \
            --git-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.core }}
          path: release-artifacts/*.zip
          if-no-files-found: error
